[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysad-k64"
version = "2.5.0"
description = "Python translation of SAD (Strategic Accelerator Design, K64 version): optics, tracking, emittance and the SADScript interpreter. v2 fixes K64 bugs and adds features; PYSAD_COMPAT=k64 reproduces K64"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pysad-k64 authors" }]
keywords = ["accelerator", "SAD", "beam optics", "particle tracking", "storage ring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy", "numba", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]       # FFS の DRAW (pysad/draw_mpl.py、v2.4.1)。無くても DRAW 以外は動く

[project.scripts]
pysad-run = "pysad.cli:run_main"
pysad-share = "pysad.cli:share_main"
pysad-warmup = "pysad.cli:warmup_main"

[project.urls]
Homepage = "https://github.com/Ken-Harada1234/pysad"
Source = "https://github.com/Ken-Harada1234/pysad"
Changelog = "https://github.com/Ken-Harada1234/pysad/blob/main/CHANGELOG.md"

[tool.setuptools.package-data]
pysad = ["sad_copy/**/*", "data/*"]       # SAD のソースからコピーしたファイル (pysad/sad_copy/README.md)

[tool.setuptools.packages.find]
include = ["pysad"]
exclude = ["pysad.tests", "pysad.tests.*"]
